# Test environment properties (H2 In-Memory Database)
spring.datasource.url=jdbc:h2:mem:resolveit_test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

app.jwt.secret=test-secret-key-must-be-at-least-32-characters-long-12345
app.jwt.expiration-minutes=60

app.seed.enabled=false
app.bootstrap-admin.email=
app.bootstrap-admin.password=

app.security.login.max-attempts=5
app.security.login.window-minutes=15
app.security.login.lock-minutes=15
