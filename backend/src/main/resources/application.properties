server.port=${PORT:${SERVER_PORT:8080}}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/resolveit_simple_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jackson.serialization.write-dates-as-timestamps=false

app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-minutes=1440
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# Demo data seeding (disabled by default)
app.seed.enabled=${SEED_ENABLED:false}
app.seed.demo-password=${SEED_DEMO_PASSWORD:}

# First-admin bootstrap (optional)
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap-admin.name=${BOOTSTRAP_ADMIN_NAME:Administrator}

# Login-attempt throttling
app.security.login.max-attempts=${LOGIN_MAX_ATTEMPTS:5}
app.security.login.window-minutes=${LOGIN_WINDOW_MINUTES:15}
app.security.login.lock-minutes=${LOGIN_LOCK_MINUTES:15}

# Optional local overrides for local developer machine
spring.config.import=optional:classpath:application-local.properties
